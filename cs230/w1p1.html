<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Purchase Autograder</title>
        <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
        <script src="../dist/autograder.js"></script>
    </head>
    <body>
        <script>
            const CASES = [
                {
                    name: "Example 1 — 3 items at $10",
                    stdin_lines: ["10", "3"],
                    expected_lines: [
                        "Pre-tax cost= 30.0",
                        "Tax paid= 2.25",
                        "After-tax cost= 32.25",
                    ],
                },
                {
                    name: "Example 2 — 7 items at $3.95",
                    stdin_lines: ["3.95", "7"],
                    expected_lines: [
                        "Pre-tax cost= 27.65",
                        "Tax paid= 2.07",
                        "After-tax cost= 29.72",
                    ],
                },
                {
                    name: "Example 3 — 12 items at $19.99",
                    stdin_lines: ["19.99", "12"],
                    expected_lines: [
                        "Pre-tax cost= 239.88",
                        "Tax paid= 17.99",
                        "After-tax cost= 257.87",
                    ],
                },
            ];

            function build_criteria(results) {
                return [
                    {
                        id: "input",
                        name: "Input handling",
                        points: 10,
                        description:
                            "Source calls input() with the exact prompt text from the handout.",
                        type: "code",
                        needles: [
                            [
                                'input("Enter price per item: ")',
                                "input('Enter price per item: ')",
                                'input("Enter price per item:")',
                                "input('Enter price per item:')",
                            ],
                            [
                                'input("Enter number of items: ")',
                                "input('Enter number of items: ')",
                                'input("Enter number of items:")',
                                "input('Enter number of items:')",
                            ],
                        ],
                        mode: "all",
                    },
                    {
                        id: "output",
                        name: "Correct output",
                        points: 20,
                        description:
                            "20 points split evenly across all examples, prorated by the % of lines that match exactly.",
                        type: "output-diff",
                        cases: CASES,
                        anchor_prefix: "Pre-tax cost=",
                    },
                    {
                        id: "flake8",
                        name: "flake8",
                        points: 10,
                        description:
                            "−1 point per flake8 finding, down to a floor of 0.",
                        type: "flake8",
                        partial: true,
                    },
                ];
            }

            // The page markup (header, drop zone, rubric, summary box) is generated by
            // the library, and css/a1.css is picked up from beside the bundle.
            Autograder.grader_app.init({
                filename: "w1-1.py",
                subtitle:
                    "Week 1 · Problem 1 · w1-1.py · 40 auto-graded points",
                footer: "bi3mer · Runs Python via Pyodide. Nothing is uploaded.",
                cases: CASES,
                build_criteria,
                max_auto_points: 40,
            });
        </script>
    </body>
</html>
