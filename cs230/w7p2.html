<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gradebook Autograder</title>
        <link rel="stylesheet" href="../css/a1.css" />
        <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    </head>
    <body>
        <div class="split">
            <section class="sheet">
                <!-- The whole problem statement, fetched from w7p2.md and
                     rendered by src/markdown.js. The file is the handout,
                     readable on its own. -->
                <div class="prose" id="handout"></div>
            </section>

            <section id="grader"></section>
        </div>
        <footer>bi3mer · Runs Python via Pyodide</footer>

        <script type="module">
            import { grader_app } from "../src/main.js";
            import { assert } from "../src/assert.js";

            // The prompt drives both the input() needle the rubric looks for
            // and the transcript each case expects, so the wording is written
            // once here. The handout quotes it again in w7p2.md, which is the
            // one place the two can drift.
            const PROMPT = "File name: ";
            const SKIPPED = "Skipped: ";

            // The files live in w7p2/ beside this page, where the handout
            // links the first two for download. Each case fetches its file
            // from there, so the copy a student saves and the copy the grader
            // opens are the same bytes.
            const FILES_DIR = "w7p2/";

            // What int() makes of one score field, or null when int() raises.
            // int() takes surrounding whitespace, a sign, and digits, which
            // the regex matches; it also takes underscores between digits and
            // digits from other scripts, which the regex would wrongly reject.
            // No file holds either, and the asserts keep it that way, so the
            // two agree on every field.
            const PYTHON_INT = /^\s*[+-]?\d+\s*$/;
            function python_int(text) {
                assert(!text.includes("_"), `python_int: "${text}" has an underscore, which int() accepts`);
                if (!PYTHON_INT.test(text)) return null;
                const number = Number.parseInt(text.trim(), 10);
                assert(Number.isSafeInteger(number), `python_int: "${text}" out of range`);
                return number;
            }

            // f"{value:.2f}" for an average the case builder has already
            // computed. Python and JS divide the same integers with the same
            // IEEE operation, so the double is identical, and both round its
            // exact value to two decimals. They differ only on an exact tie,
            // where JS's toFixed rounds up and Python rounds to even. A tie
            // needs the value times 100 to end in exactly .5, as 87.125 does;
            // the assert keeps every case off that edge, as in w6p1.
            function two_decimals(value) {
                const half_cent = Number.isInteger(value * 200) && !Number.isInteger(value * 100);
                assert(!half_cent, `two_decimals: ${value} rounds differently in Python`);
                return value.toFixed(2);
            }

            function letter_grade(average) {
                if (average >= 90) return "A";
                if (average >= 80) return "B";
                if (average >= 70) return "C";
                if (average >= 60) return "D";
                return "F";
            }

            // What the program prints after the prompt for one file, worked
            // out the way the handout describes: the header skipped, then one
            // line per line of the file, in order, either the student's
            // average and letter or Skipped for a score int() rejects. Python's strip() and JS's trim() agree
            // on ASCII whitespace, and the files are ASCII. A file that ends
            // with a newline has no line after it, so that last empty piece
            // of the split goes. The handout promises no blank lines and at
            // least one score per line, and the asserts hold the files to it.
            function report_lines(text) {
                assert(/^[\x20-\x7e\n]*$/.test(text), "report_lines: files must be printable ASCII");
                const lines = text === "" ? [] : text.split("\n");
                if (lines.at(-1) === "") lines.pop();
                const printed = [];
                for (const raw of lines.slice(1)) {
                    const line = raw.trim();
                    const fields = line.split(",");
                    assert(line !== "" && fields.length >= 2, `report_lines: "${line}" breaks the handout's promise`);
                    const scores = fields.slice(1).map(python_int);
                    if (scores.includes(null)) {
                        printed.push(SKIPPED + line);
                        continue;
                    }
                    const average = scores.reduce((running, score) => running + score, 0) / scores.length;
                    printed.push(`${fields[0]}: ${two_decimals(average)} (${letter_grade(average)})`);
                }
                return printed;
            }

            // A case is one file: its name typed at the prompt, the file put
            // in the run's directory, and the transcript the prompt and then
            // what the file's report prints.
            async function file_case(name, filename) {
                const response = await fetch(FILES_DIR + filename);
                assert(response.ok, `file_case "${name}": ${filename} answered ${response.status}`);
                const text = await response.text();
                return {
                    name,
                    stdin_lines: [filename],
                    files: { [filename]: text },
                    expected_lines: [PROMPT + filename, ...report_lines(text)],
                };
            }

            // A name typed with no file behind it. The run's directory holds
            // nothing, so open() raises FileNotFoundError.
            function missing_case(name, filename) {
                return {
                    name,
                    stdin_lines: [filename],
                    files: {},
                    expected_lines: [PROMPT + filename, `Could not open ${filename}.`],
                };
            }

            // Cases 1-3 are the handout's examples. Case 1's Linus has two
            // scores, which catches a fixed number of fields, and Grace's abc
            // catches a missing ValueError. Case 2 is a header with no
            // students, and case 3 a file that does not exist. Case 4's spaces
            // around the scores catch an isdigit() check in place of int().
            // Case 5 skips four different ways, including an empty score left
            // by a comma at the end of the line. Case 6 skips every line, so
            // every line printed is a Skipped line. Case 7 puts averages on every
            // letter's boundary, and case 8 is a file with no bytes at all,
            // not even a header.
            const CASES = await Promise.all([
                file_case("Example 1 — grades.csv", "grades.csv"),
                file_case("Example 2 — a header and no students", "empty.csv"),
                missing_case("Example 3 — a file that does not exist", "missing.csv"),
                file_case("Example 4 — spaces around the scores", "spaces.csv"),
                file_case("Example 5 — four lines to skip", "skips.csv"),
                file_case("Example 6 — every line skipped", "letters.csv"),
                file_case("Example 7 — averages on every letter's boundary", "honors.csv"),
                file_case("Example 8 — a file with nothing in it", "blank.csv"),
            ]);

            // Both quote styles, and with or without the trailing space, so a
            // student is graded on the prompt's wording rather than on which
            // quote character they reached for.
            function prompt_needles(prompt) {
                const trimmed = prompt.trimEnd();
                return [
                    `input("${prompt}")`,
                    `input('${prompt}')`,
                    `input("${trimmed}")`,
                    `input('${trimmed}')`,
                ];
            }

            // Strings and comments are blanked before scanning, as in w6p1,
            // so the summary pasted in as a docstring cannot read as code.
            // Blanking keeps every newline, so line numbers still match.
            const TRIPLE_QUOTED = /"""[\s\S]*?"""|'''[\s\S]*?'''/g;
            const SINGLE_QUOTED = /"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'/g;
            const COMMENT = /#[^\n]*/g;
            function code_only(source) {
                return source
                    .replace(TRIPLE_QUOTED, (text) => text.replace(/[^\n]/g, ""))
                    .replace(SINGLE_QUOTED, '""')
                    .replace(COMMENT, "");
            }

            // code_only() blanks an f-string's fields too, which hides a call
            // made inside one, as in f"{letter_grade(score)}". This keeps the
            // expressions inside an f-string's braces and blanks the rest,
            // for the checks that look for a call. Each string stays on its
            // own line, so line numbers still match.
            const PREFIXED_STRING = /(\b[rRbBuUfF]{1,2})?("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')/g;
            const FSTRING_FIELD = /\{([^{}]*)\}/g;
            function code_and_fields(source) {
                return source
                    .replace(TRIPLE_QUOTED, (text) => text.replace(/[^\n]/g, ""))
                    .replace(PREFIXED_STRING, (text, prefix) => {
                        if (prefix === undefined || !/f/i.test(prefix)) return '""';
                        const fields = [...text.matchAll(FSTRING_FIELD)].map((field) => field[1]);
                        return `"" ${fields.join(" ")} ""`;
                    })
                    .replace(COMMENT, "");
            }

            function quote_line(context, line_number) {
                return context.source.split("\n")[line_number - 1].trim();
            }

            function failing_line(context, line_number, reason, advice) {
                return {
                    pass: false,
                    detail:
                        `Line ${line_number} ${reason} ("${quote_line(context, line_number)}"). ` +
                        advice,
                };
            }

            function passing_line(context, line_number) {
                return {
                    pass: true,
                    detail: `Line ${line_number}: "${quote_line(context, line_number)}".`,
                };
            }

            // The def of `name` and its body, as `{ line_number, body }`, or
            // null when the source defines no such function. The body is
            // every line after the def that is blank or indented past it, up
            // to the first line that is not, which is where Python ends the
            // block.
            const LEADING_SPACE = /^[ \t]*/;
            function function_body(source, name) {
                const def = new RegExp(`^([ \\t]*)def\\s+${name}\\s*\\(`);
                const lines = source.split("\n");
                for (let index = 0; index < lines.length; index++) {
                    const match = lines[index].match(def);
                    if (match === null) continue;
                    const def_indent = match[1].length;
                    const body = [];
                    for (let next = index + 1; next < lines.length; next++) {
                        const text = lines[next];
                        const indent = text.match(LEADING_SPACE)[0].length;
                        if (text.trim() !== "" && indent <= def_indent) break;
                        body.push({ line_number: next + 1, text });
                    }
                    return { line_number: index + 1, body };
                }
                return null;
            }

            function no_function(signature) {
                return {
                    pass: false,
                    detail: `No ${signature.split("(")[0]}() function found. Define it with def ${signature}:.`,
                };
            }

            // The problem is about splitting a program into functions, so each
            // one the handout names is a third of this row: defined, handing
            // its answer back with return, and called somewhere besides its
            // own def. The output rows cannot see any of that, since one long
            // block of code prints the same transcript. print_report() prints
            // the report and hands nothing back, so it is the one function
            // exempt from both rules. main() has its own row.
            const PRINT_CALL = /\bprint\s*\(/;
            const RETURN_VALUE = /^[ \t]*return\s+\S/;
            const FUNCTIONS = [
                { signature: "letter_grade(score)", reports: false },
                { signature: "parse_line(line)", reports: false },
                { signature: "print_report(filename)", reports: true },
            ];
            function function_problem(source, calls_source, { signature, reports }) {
                const name = signature.split("(")[0];
                const found = function_body(source, name);
                if (found === null) return `No ${name}() found (define it with def ${signature}:)`;
                const printed = found.body.find((line) => PRINT_CALL.test(line.text));
                if (!reports && printed !== undefined) {
                    return `${name}() calls print() on line ${printed.line_number} (return the answer instead)`;
                }
                if (!reports && !found.body.some((line) => RETURN_VALUE.test(line.text))) {
                    return `${name}() never returns a value`;
                }
                const call = new RegExp(`\\b${name}\\s*\\(`);
                const called = calls_source
                    .split("\n")
                    .some((line, index) => index !== found.line_number - 1 && call.test(line));
                if (!called) return `${name}() is defined but never called`;
                return null;
            }

            function functions_check(context) {
                const source = code_only(context.source);
                const calls_source = code_and_fields(context.source);
                const problems = FUNCTIONS.map((spec) => function_problem(source, calls_source, spec)).filter(
                    (problem) => problem !== null,
                );
                const earned = (15 * (FUNCTIONS.length - problems.length)) / FUNCTIONS.length;
                if (problems.length === 0) {
                    return { earned, detail: "All three are defined and called, and the first two return their answers." };
                }
                return { earned, detail: problems.map((problem) => `${problem}.`).join(" ") };
            }

            // Half the row for a for loop straight over the file print_report()
            // opened, and half for the readline() that skips the header.
            // `with open(...) as name:` and `name = open(...)` both count as
            // opening it. A readlines() list or a flag that ignores the first
            // line prints the same transcript, which is why this is a row.
            const WITH_OPEN = /^[ \t]*with\s+open\s*\(.*\)\s+as\s+([A-Za-z_]\w*)\s*:/;
            const OPEN_ASSIGNMENT = /^[ \t]*([A-Za-z_]\w*)\s*=\s*open\s*\(/;
            const READLINE_CALL = /\.\s*readline\s*\(\s*\)/;
            function read_check(context) {
                const found = function_body(code_only(context.source), "print_report");
                if (found === null) return no_function("print_report(filename)");
                let opened = null;
                for (const line of found.body) {
                    const match = line.text.match(WITH_OPEN) ?? line.text.match(OPEN_ASSIGNMENT);
                    if (match !== null) {
                        opened = match[1];
                        break;
                    }
                }
                if (opened === null) {
                    return {
                        pass: false,
                        detail: 'print_report() opens no file. Write with open(filename, "r") as f: inside it.',
                    };
                }
                const loop = new RegExp(`^[ \\t]*for\\s+[A-Za-z_]\\w*\\s+in\\s+${opened}\\s*:`);
                const looped = found.body.some((line) => loop.test(line.text));
                const skipped = found.body.some((line) => READLINE_CALL.test(line.text));
                const earned = (looped ? 5 : 0) + (skipped ? 5 : 0);
                const missing = [];
                if (!looped) missing.push(`no for loop goes over ${opened}`);
                if (!skipped) missing.push("no readline() skips the header");
                if (missing.length === 0) return { earned, detail: "Loops over the file after readline() skips the header." };
                return { earned, detail: `In print_report(), ${missing.join(", and ")}.` };
            }

            // Half the row for each exception the handout names. A bare
            // except, or one naming Exception, also swallows the NameError
            // from a typo, which the Find the Bug slide shows, so one
            // anywhere in the program zeroes the row.
            const EXCEPT_BARE = /^[ \t]*except\s*:/;
            const EXCEPT_BROAD = /^[ \t]*except\s*\(?\s*(?:Base)?Exception\b/;
            const NAMED_EXCEPTIONS = ["ValueError", "FileNotFoundError"];
            function exceptions_check(context) {
                const lines = code_only(context.source).split("\n");
                const broad = lines.findIndex((line) => EXCEPT_BARE.test(line) || EXCEPT_BROAD.test(line));
                if (broad !== -1) {
                    return failing_line(
                        context, broad + 1, "catches every exception",
                        "Name the ones you expect: except ValueError: and except FileNotFoundError:.",
                    );
                }
                const missing = NAMED_EXCEPTIONS.filter((exception) => {
                    const named = new RegExp(`^[ \\t]*except\\b[^:]*\\b${exception}\\b`);
                    return !lines.some((line) => named.test(line));
                });
                const earned = (10 * (NAMED_EXCEPTIONS.length - missing.length)) / NAMED_EXCEPTIONS.length;
                if (missing.length === 0) return { earned, detail: "Both are named." };
                return { earned, detail: `No except ${missing.join(" or except ")} found.` };
            }

            // main() holds the program's work, and the program ends with the
            // __main__ check calling it. That check compares strings, so it is
            // matched with strings kept and only docstrings and comments
            // blanked; the summary pasted at the top is a docstring, so its
            // row name cannot pass the row. Any other line at the left margin,
            // besides a def or an import, is code running outside a function.
            const MAIN_GUARD = /^if\s+(?:__name__\s*==\s*(["'])__main__\1|(["'])__main__\2\s*==\s*__name__)\s*:\s*$/;
            const MAIN_CALL = /^[ \t]+main\s*\(\s*\)\s*$/;
            const TOP_LEVEL_ALLOWED = /^(?:def|import|from)\s/;
            const INDENTED = /^[ \t]/;
            function main_check(context) {
                const blanked = code_only(context.source).split("\n");
                if (function_body(blanked.join("\n"), "main") === null) return no_function("main()");
                const kept = context.source
                    .replace(TRIPLE_QUOTED, (text) => text.replace(/[^\n]/g, ""))
                    .replace(COMMENT, "")
                    .split("\n");
                const guard = kept.findIndex((line) => MAIN_GUARD.test(line));
                for (let index = 0; index < blanked.length; index++) {
                    const line = blanked[index];
                    if (line.trim() === "" || INDENTED.test(line)) continue;
                    if (index === guard || TOP_LEVEL_ALLOWED.test(line)) continue;
                    return failing_line(
                        context, index + 1, "runs outside any function",
                        "Move it into main(), and end the program with the last two lines of the starter code.",
                    );
                }
                if (guard === -1) {
                    return {
                        pass: false,
                        detail: 'No if __name__ == "__main__": line found. End the program with the last two lines of the starter code.',
                    };
                }
                const call = kept.slice(guard + 1).find((line) => line.trim() !== "");
                if (call === undefined || !MAIN_CALL.test(call)) {
                    return failing_line(
                        context, guard + 1, "is not followed by a call to main()",
                        "Put main() on the line under it, indented.",
                    );
                }
                return passing_line(context, guard + 1);
            }

            // The csv module and pandas do the reading and splitting this
            // problem is about, so either one zeroes the submission, the same
            // as a syntax error. The gate scans the blanked source, so the
            // row's own name pasted into the docstring cannot trip it.
            const PARSING_IMPORT = /^[ \t]*(?:import|from)\s+(?:csv|pandas)\b/;
            function no_parsing_import_check(source) {
                const lines = code_only(source).split("\n");
                const index = lines.findIndex((line) => PARSING_IMPORT.test(line));
                if (index === -1) return { pass: true, detail: "" };
                return failing_line(
                    { source }, index + 1, "imports csv or pandas",
                    "Read the lines and split them yourself. Importing either one scores zero.",
                );
            }

            // The custom rows scan the blanked source, so a row's name pasted
            // back as a docstring line cannot trip its own check. The input
            // row scans the raw source, and no row name contains the prompt.
            function build_criteria(results) {
                return [
                    {
                        id: "input",
                        name: "Input handling",
                        points: 5,
                        description:
                            "Source calls input() with the exact prompt text from the handout.",
                        type: "code",
                        needles: [prompt_needles(PROMPT)],
                        mode: "all",
                    },
                    {
                        id: "output",
                        name: "Correct output",
                        points: 35,
                        description:
                            "35 points split evenly across all examples, prorated by the % of lines that match exactly.",
                        type: "output-diff",
                        cases: CASES,
                    },
                    {
                        id: "functions",
                        name: "Functions",
                        points: 15,
                        description:
                            "5 points each for letter_grade(), parse_line(), and print_report(): defined and called. The first two return their answer and print nothing.",
                        type: "custom",
                        check: functions_check,
                    },
                    {
                        id: "read",
                        name: "Reads the file in print_report()",
                        points: 10,
                        description:
                            "5 points for a for loop over the opened file, and 5 for readline() skipping the header.",
                        type: "custom",
                        check: read_check,
                    },
                    {
                        id: "exceptions",
                        name: "Names the exceptions it catches",
                        points: 10,
                        description:
                            "5 points each for except ValueError and except FileNotFoundError; a bare except scores zero.",
                        type: "custom",
                        check: exceptions_check,
                    },
                    {
                        id: "main",
                        name: "Runs from main()",
                        points: 5,
                        description:
                            'Every line runs inside a function, and the program ends with if __name__ == "__main__": calling main().',
                        type: "custom",
                        check: main_check,
                    },
                ];
            }

            // The right column only: w7p2.md fills the left, and the page
            // carries its own footer below both.
            grader_app.init({
                filename: "w7-2.py",
                editor: true,
                title: "Submission",
                subtitle: "Graded in this tab · nothing leaves your browser",
                cases: CASES,
                build_criteria,
                max_auto_points: 80,
                mount: "#grader",
                handout: "w7p2.md",
                gates: [
                    {
                        name: "Does not import csv or pandas",
                        description:
                            "Gate: importing csv or pandas forces a total score of zero, the same as a syntax error.",
                        check: no_parsing_import_check,
                    },
                ],
            });
        </script>
    </body>
</html>
