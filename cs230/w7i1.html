<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Drop the Lowest Autograder</title>
        <link rel="stylesheet" href="../css/a1.css" />
        <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    </head>
    <body>
        <div class="split">
            <section class="sheet">
                <!-- The whole problem statement, fetched from w7i1.md and
                     rendered by src/markdown.js. The file is the handout,
                     readable on its own. -->
                <div class="prose" id="handout"></div>
            </section>

            <section id="grader"></section>
        </div>
        <footer>bi3mer · Runs Python via Pyodide</footer>

        <script type="module">
            import { grader_app } from "../src/main.js";
            import { assert } from "../src/assert.js";

            // The prompt drives both the input() needle the rubric looks for
            // and the transcript each case expects, so the wording is written
            // once here. The handout quotes it again in w7i1.md, which is the
            // one place the two can drift.
            const PROMPT = "Score: ";

            // print() of a list of ints, as Python writes it. Every score is
            // asserted to be a whole number of zero or more, so String()
            // matches Python's repr.
            function python_list(scores) {
                return `[${scores.join(", ")}]`;
            }

            // The handout's rule: every score but one copy of the lowest,
            // lowest first. An empty list stays empty.
            function kept_scores(scores) {
                const kept = [...scores].sort((a, b) => a - b);
                kept.shift();
                return kept;
            }

            // A case is the scores typed at the prompt, in order. Each answer
            // is echoed after its prompt, a blank answer ends the input, and
            // the handout's last two lines print the entered list and then
            // the kept list, so the transcript is generated from the scores.
            // Both lines print after drop_lowest() runs, which is what lets
            // the Entered line show a list that drop_lowest() changed.
            function scores_case(name, scores) {
                for (const score of scores) {
                    assert(
                        Number.isInteger(score) && score >= 0,
                        `scores_case "${name}": ${score} must be a whole number of zero or more`,
                    );
                }
                return {
                    name,
                    stdin_lines: [...scores.map(String), ""],
                    expected_lines: [
                        ...scores.map((score) => PROMPT + score),
                        PROMPT,
                        `Entered: ${python_list(scores)}`,
                        `Kept: ${python_list(kept_scores(scores))}`,
                    ],
                };
            }

            // Cases 1-4 are the handout's examples. Every case with a score
            // catches a drop_lowest() that removes from the caller's list,
            // directly or through kept = scores, since Entered then loses a
            // score. Case 1 is entered out of order, which catches
            // scores.sort() (Entered comes out sorted) and a kept list left
            // unsorted. Cases 2 and 7 tie for lowest, which catches dropping
            // every copy. Case 4 is empty, which catches min() or pop() on an
            // empty list. Case 5 puts the lowest last and case 6 enters the
            // scores highest first, which catches dropping by position rather
            // than by value. Case 8 is twelve scores with a zero among them,
            // which catches a loop capped at a fixed count.
            const CASES = [
                scores_case("Example 1 — four scores", [90, 72, 85, 100]),
                scores_case("Example 2 — a tie for lowest drops only one", [70, 80, 70]),
                scores_case("Example 3 — one score leaves nothing", [95]),
                scores_case("Example 4 — no scores", []),
                scores_case("Example 5 — the lowest entered last", [88, 93, 79, 61]),
                scores_case("Example 6 — highest first", [100, 90, 80, 70]),
                scores_case("Example 7 — every score the same", [88, 88, 88]),
                scores_case(
                    "Example 8 — twelve scores, including a zero",
                    [77, 0, 94, 85, 100, 63, 91, 72, 88, 55, 99, 81],
                ),
            ];

            // Both quote styles, and with or without the trailing space, so a
            // student is graded on the prompt's wording rather than on which
            // quote character they reached for.
            function prompt_needles(prompt) {
                const trimmed = prompt.trimEnd();
                return [
                    `input("${prompt}")`,
                    `input('${prompt}')`,
                    `input("${trimmed}")`,
                    `input('${trimmed}')`,
                ];
            }

            // Strings and comments are blanked before scanning, as in w5i2.
            // The summary students paste in as a docstring is prose, and its
            // "drop_lowest() leaves scores unchanged" line would otherwise
            // read as code. Docstrings and comments keep only their newlines,
            // so the line numbers in the detail still match the editor.
            const TRIPLE_QUOTED = /"""[\s\S]*?"""|'''[\s\S]*?'''/g;
            const SINGLE_QUOTED = /"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'/g;
            const COMMENT = /#[^\n]*/g;
            function code_only(source) {
                return source
                    .replace(TRIPLE_QUOTED, (text) => text.replace(/[^\n]/g, ""))
                    .replace(SINGLE_QUOTED, '""')
                    .replace(COMMENT, "");
            }

            // Line `line_number` of the student's source as they wrote it.
            // Matching runs on the blanked source, but blanking keeps every
            // newline, so the numbers line up.
            function quote_line(context, line_number) {
                return context.source.split("\n")[line_number - 1].trim();
            }

            function failing_line(context, line_number, reason, advice) {
                return {
                    pass: false,
                    detail:
                        `Line ${line_number} ${reason} ("${quote_line(context, line_number)}"). ` +
                        advice,
                };
            }

            function passing_line(context, line_number) {
                return {
                    pass: true,
                    detail: `Line ${line_number}: "${quote_line(context, line_number)}".`,
                };
            }

            // The def of `name` and its body, as `{ line_number, body }`, or
            // null when the source defines no such function. The body is
            // every line after the def that is blank or indented past it, up
            // to the first line that is not, which is where Python ends the
            // block.
            const LEADING_SPACE = /^[ \t]*/;
            function function_body(source, name) {
                const def = new RegExp(`^([ \\t]*)def\\s+${name}\\s*\\(`);
                const lines = source.split("\n");
                for (let index = 0; index < lines.length; index++) {
                    const match = lines[index].match(def);
                    if (match === null) continue;
                    const def_indent = match[1].length;
                    const body = [];
                    for (let next = index + 1; next < lines.length; next++) {
                        const text = lines[next];
                        const indent = text.match(LEADING_SPACE)[0].length;
                        if (text.trim() !== "" && indent <= def_indent) break;
                        body.push({ line_number: next + 1, text });
                    }
                    return { line_number: index + 1, body };
                }
                return null;
            }

            function no_function(signature) {
                return {
                    pass: false,
                    detail: `No ${signature.split("(")[0]}() function found. Define it with def ${signature}:.`,
                };
            }

            // The output rows already fail a program that reads a fixed
            // number of scores, so this row is about where the reading
            // lives: inside read_scores(), in a while loop, growing the list
            // with append(). `while True:` with a break or a return passes
            // like any other while.
            const INPUT_CALL = /\binput\s*\(/;
            const WHILE_STATEMENT = /^[ \t]*while\b/;
            const APPEND_CALL = /\.\s*append\s*\(/;
            function loop_check(context) {
                const found = function_body(code_only(context.source), "read_scores");
                if (found === null) return no_function("read_scores()");
                if (!found.body.some((line) => INPUT_CALL.test(line.text))) {
                    return failing_line(
                        context, found.line_number,
                        "defines read_scores() but never calls input() inside it",
                        "The function itself asks for each score.",
                    );
                }
                const loop = found.body.find((line) => WHILE_STATEMENT.test(line.text));
                if (loop === undefined) {
                    return failing_line(
                        context, found.line_number, "defines read_scores() without a while loop inside it",
                        "Keep asking in a loop until the answer is blank.",
                    );
                }
                if (!found.body.some((line) => APPEND_CALL.test(line.text))) {
                    return failing_line(
                        context, found.line_number, "defines read_scores() without calling append() inside it",
                        "Add each score to the end of the list with .append().",
                    );
                }
                return passing_line(context, loop.line_number);
            }

            // Leaving the caller's list alone is the point of the activity.
            // The output rows show a changed list only as a wrong Entered
            // line; this row names the line that changed it. The scan tracks
            // every name that still reaches the caller's list: the parameter,
            // plus any plain alias such as `kept = scores`, which copies the
            // reference and not the list. A name assigned anything else
            // (`scores = sorted(scores)`, `kept = scores.copy()`) reaches a
            // new list from then on, which is fine to change. The scan reads
            // the body top to bottom and ignores which branch a line sits
            // in, which is enough for programs this size.
            const DEF_PARAMETER = /^[ \t]*def\s+drop_lowest\s*\(\s*([A-Za-z_]\w*)/;
            const ASSIGNMENT = /^[ \t]*([A-Za-z_]\w*)\s*=(?!=)\s*(.*?)\s*$/;
            const MUTATING_METHODS = "append|insert|remove|pop|sort|reverse|clear|extend";
            function changes(text, name) {
                const method = new RegExp(
                    `(?<![\\w.])${name}\\s*\\.\\s*(?:${MUTATING_METHODS})\\s*\\(`,
                );
                const item = new RegExp(`(?<![\\w.])${name}\\s*\\[[^\\]\\n]*\\]\\s*[-+*/]?=(?!=)`);
                const deletion = new RegExp(`^[ \\t]*del\\s+${name}\\b`);
                const augmented = new RegExp(`(?<![\\w.])${name}\\s*(?:\\+=|\\*=)`);
                return [method, item, deletion, augmented].some((pattern) => pattern.test(text));
            }

            function unchanged_check(context) {
                const source = code_only(context.source);
                const found = function_body(source, "drop_lowest");
                if (found === null) return no_function("drop_lowest(scores)");
                const parameter = source.split("\n")[found.line_number - 1].match(DEF_PARAMETER);
                if (parameter === null) {
                    return failing_line(
                        context, found.line_number, "defines drop_lowest() without a parameter",
                        "Take the list of scores as the parameter: def drop_lowest(scores):.",
                    );
                }
                const original = parameter[1];
                // Each name that reaches the caller's list, mapped to the
                // line that made it an alias, or null for the parameter.
                const shared = new Map([[original, null]]);
                for (const { line_number, text } of found.body) {
                    for (const [name, alias_line] of shared) {
                        if (!changes(text, name)) continue;
                        if (alias_line === null) {
                            return failing_line(
                                context, line_number, `changes ${name}, the caller's list`,
                                "Make a new list with copy() or sorted() and change that one instead.",
                            );
                        }
                        return failing_line(
                            context, line_number,
                            `changes ${name}, which line ${alias_line} made another name for ${original}`,
                            `${name} = ${original} copies the reference, not the list. ` +
                                `Use ${original}.copy() or sorted(${original}) instead.`,
                        );
                    }
                    const assignment = text.match(ASSIGNMENT);
                    if (assignment === null) continue;
                    const [, target, value] = assignment;
                    if (shared.has(value)) {
                        if (!shared.has(target)) shared.set(target, line_number);
                    } else {
                        shared.delete(target);
                    }
                }
                return { pass: true, detail: `drop_lowest() never changes ${original}.` };
            }

            // A function that prints its answer and returns nothing puts
            // None in the transcript, which the output rows charge for
            // without saying where it came from; this row names the line.
            // input() inside drop_lowest() is the other slip, since the
            // scores arrive as the parameter.
            const PRINT_CALL = /\bprint\s*\(/;
            const RETURN_STATEMENT = /^[ \t]*return\b(.*)$/;
            const RETURNING_FUNCTIONS = [
                {
                    name: "read_scores",
                    signature: "read_scores()",
                    advice: "Return the list of scores.",
                    reads_input: true,
                },
                {
                    name: "drop_lowest",
                    signature: "drop_lowest(scores)",
                    advice: "Return the new list.",
                    reads_input: false,
                },
            ];

            // `{ pass: false, detail }` for the first slip in one function's
            // body, or `{ pass: true, line_number }` for its first return.
            function first_return(context, found, spec) {
                let line_found = null;
                for (const { line_number, text } of found.body) {
                    if (PRINT_CALL.test(text)) {
                        return failing_line(
                            context, line_number, `calls print() inside ${spec.name}()`,
                            "Return the list instead; the last lines of the program print it.",
                        );
                    }
                    if (!spec.reads_input && INPUT_CALL.test(text)) {
                        return failing_line(
                            context, line_number, `calls input() inside ${spec.name}()`,
                            "The scores arrive as the parameter; read_scores() reads them.",
                        );
                    }
                    const statement = text.match(RETURN_STATEMENT);
                    if (statement === null) continue;
                    if (statement[1].trim() === "") {
                        return failing_line(context, line_number, "returns nothing", spec.advice);
                    }
                    line_found ??= line_number;
                }
                if (line_found === null) {
                    return failing_line(
                        context, found.line_number,
                        `defines ${spec.name}() without a return statement`, spec.advice,
                    );
                }
                return { pass: true, line_number: line_found };
            }

            function returns_check(context) {
                const source = code_only(context.source);
                const shown = [];
                for (const spec of RETURNING_FUNCTIONS) {
                    const found = function_body(source, spec.name);
                    if (found === null) return no_function(spec.signature);
                    const outcome = first_return(context, found, spec);
                    if (!outcome.pass) return outcome;
                    shown.push(
                        `Line ${outcome.line_number}: "${quote_line(context, outcome.line_number)}"`,
                    );
                }
                assert(shown.length === RETURNING_FUNCTIONS.length, "returns_check: one return per function");
                return { pass: true, detail: `${shown.join("; ")}.` };
            }

            // The custom rows scan the blanked source, so a row's name pasted
            // back as a docstring line cannot trip its own check. The input
            // row scans the raw source, and no row name contains the prompt.
            function build_criteria(results) {
                return [
                    {
                        id: "input",
                        name: "Input handling",
                        points: 5,
                        description:
                            "Source calls input() with the exact prompt text from the handout.",
                        type: "code",
                        needles: [prompt_needles(PROMPT)],
                        mode: "all",
                    },
                    {
                        id: "output",
                        name: "Correct output",
                        points: 20,
                        description:
                            "20 points split evenly across all examples, prorated by the % of lines that match exactly.",
                        type: "output-diff",
                        cases: CASES,
                    },
                    {
                        id: "loop",
                        name: "Loop in read_scores()",
                        points: 5,
                        description:
                            "read_scores() asks for scores with input() inside a while loop and adds each one with .append().",
                        type: "custom",
                        check: loop_check,
                    },
                    {
                        id: "unchanged",
                        name: "drop_lowest() leaves scores unchanged",
                        points: 5,
                        description:
                            "drop_lowest() never removes, adds, or reorders items in the list it was given, directly or through another name for it.",
                        type: "custom",
                        check: unchanged_check,
                    },
                    {
                        id: "returns",
                        name: "Returns instead of prints",
                        points: 5,
                        description:
                            "Both functions hand back their list with return and print nothing; drop_lowest() calls no input().",
                        type: "custom",
                        check: returns_check,
                    },
                ];
            }

            // The right column only: w7i1.md fills the left, and the page
            // carries its own footer below both.
            grader_app.init({
                filename: "w7-i1.py",
                editor: true,
                title: "Submission",
                subtitle: "Graded in this tab · nothing leaves your browser",
                cases: CASES,
                build_criteria,
                max_auto_points: 40,
                mount: "#grader",
                handout: "w7i1.md",
            });
        </script>
    </body>
</html>
