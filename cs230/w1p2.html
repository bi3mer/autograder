<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Parking Fee Autograder</title>
        <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    </head>
    <body>
        <script type="module">
            import { grader_app } from "../src/main.js";

            const CASES = [
                {
                    name: "Example 1 — 2.5 hours",
                    stdin_lines: ["2.5"],
                    expected_lines: ["Parking fee: $ 11.25"],
                },
                {
                    name: "Example 2 — 10 hours (over the cap)",
                    stdin_lines: ["10"],
                    expected_lines: ["Parking fee: $ 20.00"],
                },
                {
                    name: "Example 3 — 0 hours (flat fee only)",
                    stdin_lines: ["0"],
                    expected_lines: ["Parking fee: $ 5.00"],
                },
                {
                    name: "Example 4 — 6 hours (exactly at the cap)",
                    stdin_lines: ["6"],
                    expected_lines: ["Parking fee: $ 20.00"],
                },
            ];

            function build_criteria(results) {
                return [
                    {
                        id: "input",
                        name: "Input handling",
                        points: 10,
                        description:
                            "Source calls input() with the exact prompt text from the handout.",
                        type: "code",
                        needles: [
                            [
                                'input("Enter hours parked: ")',
                                "input('Enter hours parked: ')",
                                'input("Enter hours parked:")',
                                "input('Enter hours parked:')",
                            ],
                        ],
                        mode: "all",
                    },
                    {
                        id: "output",
                        name: "Correct output",
                        points: 20,
                        description:
                            "20 points split evenly across all examples, prorated by the % of lines that match exactly.",
                        type: "output-diff",
                        cases: CASES,
                        anchor_prefix: "Parking fee: $",
                    },
                    {
                        id: "flake8",
                        name: "flake8",
                        points: 10,
                        description:
                            "−1 point per flake8 finding, down to a floor of 0.",
                        type: "flake8",
                        partial: true,
                    },
                ];
            }

            // The page markup (header, drop zone, rubric, summary box) is generated by
            // the library, and css/a1.css is picked up from beside src/.
            grader_app.init({
                filename: "w1-2.py",
                subtitle:
                    "Week 1 · Problem 2 · w1-2.py · 40 auto-graded points",
                footer: "bi3mer · Runs Python via Pyodide. Nothing is uploaded.",
                cases: CASES,
                build_criteria,
                max_auto_points: 40,
            });
        </script>
    </body>
</html>
