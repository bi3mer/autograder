<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pythagorean Theorem Autograder</title>
        <link rel="stylesheet" href="../css/a1.css" />
        <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    </head>
    <body>
        <div class="split">
            <section class="sheet">
                <!-- The whole problem statement, fetched from w1p3.md and
                     rendered by src/markdown.js. The file is the handout,
                     readable on its own. -->
                <div class="prose" id="handout"></div>
            </section>

            <section id="grader"></section>
        </div>
        <footer>bi3mer · Runs Python via Pyodide</footer>

        <script type="module">
            import { grader_app } from "../src/main.js";

            // The prompts drive both the input() needles the rubric looks
            // for and the stdin each case feeds, so the wording is written
            // once here. The handout quotes them again in w1p3.md, which is
            // the one place the two can drift.
            const PROMPTS = ["Enter side a: ", "Enter side b: "];

            // Examples 1-3 are the handout's. The rest each catch a
            // wrong-but-plausible implementation, and the comment on each
            // says which one.
            //
            // Every expected value is what Python prints for f"{value:.4f}",
            // so a submission that formats some other way misses the line
            // even when its arithmetic is right.
            const CASES = [
                {
                    // The 3-4-5 triple. Also catches round(c, 4), which
                    // drops the trailing zeros and prints "5.0".
                    name: "Example 1 — sides 3 and 4",
                    stdin_lines: ["3", "4"],
                    expected_lines: ["c = 5.0000", "c^2 = 25.0000"],
                },
                {
                    name: "Example 2 — sides 1.5 and 2.5",
                    stdin_lines: ["1.5", "2.5"],
                    expected_lines: ["c = 2.9155", "c^2 = 8.5000"],
                },
                {
                    // The hypotenuse is 3.60555..., so a program that
                    // truncates rather than rounds prints 3.6055 and misses.
                    name: "Example 3 — sides 2 and 3",
                    stdin_lines: ["2", "3"],
                    expected_lines: ["c = 3.6056", "c^2 = 13.0000"],
                },
                {
                    // Catches int(input(...)), which raises on "0.1" and
                    // takes the whole run down with it.
                    name: "Example 4 — sides 0.1 and 0.2",
                    stdin_lines: ["0.1", "0.2"],
                    expected_lines: ["c = 0.2236", "c^2 = 0.0500"],
                },
                {
                    // A leg of zero. Catches a program that multiplies the
                    // sides, or that assumes both legs are positive.
                    name: "Example 5 — sides 0 and 7",
                    stdin_lines: ["0", "7"],
                    expected_lines: ["c = 7.0000", "c^2 = 49.0000"],
                },
                {
                    // c and c^2 differ here and neither is a whole number
                    // typed by the user, so swapping the two output lines
                    // shows up as two wrong lines rather than none.
                    name: "Example 6 — sides 2.5 and 6",
                    stdin_lines: ["2.5", "6"],
                    expected_lines: ["c = 6.5000", "c^2 = 42.2500"],
                },
                {
                    // A second triple, with two-digit and three-digit
                    // values. Nothing here is a new trap; it is arithmetic
                    // on a larger scale than the 3-4-5 case.
                    name: "Example 7 — sides 5 and 12",
                    stdin_lines: ["5", "12"],
                    expected_lines: ["c = 13.0000", "c^2 = 169.0000"],
                },
            ];

            // Both quote styles, and with or without the trailing space, so a
            // student is graded on the prompt's wording rather than on which
            // quote character they reached for.
            function prompt_needles(prompt) {
                const trimmed = prompt.trimEnd();
                return [
                    `input("${prompt}")`,
                    `input('${prompt}')`,
                    `input("${trimmed}")`,
                    `input('${trimmed}')`,
                ];
            }

            function build_criteria(results) {
                return [
                    {
                        id: "input",
                        name: "Input handling",
                        points: 10,
                        description:
                            "Source calls input() with the exact prompt text from the handout.",
                        type: "code",
                        needles: PROMPTS.map(prompt_needles),
                        mode: "all",
                    },
                    {
                        id: "output",
                        name: "Correct output",
                        points: 15,
                        description:
                            "15 points split evenly across all examples, prorated by the % of lines that match exactly.",
                        type: "output-diff",
                        cases: CASES,
                        anchor_prefix: "c =",
                    },
                    {
                        // A regex, not a parser: the f/rf prefix must sit right
                        // before the opening quote (word boundary ahead of it), so
                        // a .format() spec like ".4f" ending just before a closing
                        // quote does not count.
                        id: "fstrings",
                        name: "Use of f-strings",
                        points: 5,
                        description:
                            "Both values are formatted to 4 decimal places with f-strings.",
                        type: "code-regex",
                        regex: /\b(?:[rR]?[fF]|[fF][rR])["']/,
                    },
                    {
                        id: "flake8",
                        name: "flake8",
                        points: 10,
                        description:
                            "−1 point per flake8 finding, down to a floor of 0.",
                        type: "flake8",
                        partial: true,
                    },
                ];
            }

            // The right column only: w1p3.md fills the left, and the page
            // carries its own footer below both.
            grader_app.init({
                filename: "w1-3.py",
                // Written and run in the page; a dropped file lands in the
                // buffer, and Run tries one example without spending a
                // grading run.
                editor: true,
                title: "Submission",
                subtitle: "Graded in this tab · nothing leaves your browser",
                cases: CASES,
                build_criteria,
                max_auto_points: 40,
                mount: "#grader",
                handout: "w1p3.md",
            });
        </script>
    </body>
</html>
